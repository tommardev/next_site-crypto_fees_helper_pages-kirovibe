[build]
  command = "npm ci && npm run build"
  publish = ".next"

# Optimize API route caching for better performance
[[headers]]
  for = "/api/*"
  [headers.values]
    # Enable CORS for API routes
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    
    # Optimize caching for API responses
    Vary = "Accept-Encoding"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# API route specific caching - DISABLED for dynamic routes to prevent stale data
# Dynamic routes (cache-status, cex-fees, dex-fees) should not be cached by CDN
# as they contain real-time processing state and AI-enhanced data
[[headers]]
  for = "/api/cache-status*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/api/cex-fees*"
  [headers.values]
    # Reduced caching for dynamic AI-enhanced data
    # Allow API route to set its own cache headers via response
    Cache-Control = "public, max-age=60, s-maxage=300, stale-while-revalidate=600"

[[headers]]
  for = "/api/dex-fees*"
  [headers.values]
    # Reduced caching for dynamic AI-enhanced data
    # Allow API route to set its own cache headers via response
    Cache-Control = "public, max-age=60, s-maxage=300, stale-while-revalidate=600"

# Next.js handles routing automatically in serverless mode

# Environment variables set in Netlify dashboard

# Function settings for API routes
[functions]
  node_bundler = "esbuild"